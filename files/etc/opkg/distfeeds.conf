# ============================================================
# ZWRT 定制固件 opkg 软件源 (优先级: dl.openwrt.ai -> opkg.zwrt.de -> 官方)
# 构建时由工作流按设备架构替换 __FEED_ARCH__ / __FEED_TARGET__
#   wh3000pro : aarch64_cortex-a53 / mediatek/filogic
#   x86_64    : x86_64 / x86/64
# ============================================================

# ① 主源: dl.openwrt.ai (Kwrt) —— 覆盖绝大多数自定义包
src/gz kwrt_core https://dl.openwrt.ai/releases/25.12/targets/__FEED_TARGET__/6.12.112
src/gz kwrt_base https://dl.openwrt.ai/releases/25.12/packages/__FEED_ARCH__/base
src/gz kwrt_packages https://dl.openwrt.ai/releases/25.12/packages/__FEED_ARCH__/packages
src/gz kwrt_luci https://dl.openwrt.ai/releases/25.12/packages/__FEED_ARCH__/luci
src/gz kwrt_routing https://dl.openwrt.ai/releases/25.12/packages/__FEED_ARCH__/routing
src/gz kwrt_video https://dl.openwrt.ai/releases/25.12/packages/__FEED_ARCH__/video
src/gz kwrt_kiddin9 https://dl.openwrt.ai/releases/25.12/packages/__FEED_ARCH__/kiddin9

# ② 次选: opkg.zwrt.de —— 自有 opkg 源 (zwrt主题 / 5gmodem / afrp 等)
src/gz zwrt https://opkg.zwrt.de/opkg/__FEED_ARCH__

# ③ 兜底: 官方 OpenWrt
#    注意: 官方 25.12 已改用 apk, releases 下无 opkg 索引 (Packages.gz 404),
#    此兜底仅在官方对应发行版提供 opkg 索引时生效; 若 opkg update 报错请改
#    __OFFICIAL_VER__ 或注释掉本层 (dl.openwrt.ai 的 base/packages/luci 已含官方包).
src/gz base https://downloads.openwrt.org/releases/__OFFICIAL_VER__/packages/__FEED_ARCH__/base
src/gz packages https://downloads.openwrt.org/releases/__OFFICIAL_VER__/packages/__FEED_ARCH__/packages
src/gz luci https://downloads.openwrt.org/releases/__OFFICIAL_VER__/packages/__FEED_ARCH__/luci
src/gz routing https://downloads.openwrt.org/releases/__OFFICIAL_VER__/packages/__FEED_ARCH__/routing
src/gz telephony https://downloads.openwrt.org/releases/__OFFICIAL_VER__/packages/__FEED_ARCH__/telephony