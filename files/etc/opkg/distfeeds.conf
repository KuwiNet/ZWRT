# ============================================================
# ZWRT 定制固件 opkg 软件源 (优先级: dl.openwrt.ai -> luci.zwrt.de)
# 构建时由工作流按设备架构替换 __FEED_ARCH__ / __FEED_TARGET__
#   wh3000pro : aarch64_cortex-a53 / mediatek/filogic
#   x86_64    : x86_64 / x86/64
# 固件基于 ImmortalWrt openwrt-25.12 (内核 6.12, 构建强制 opkg).
# dl.openwrt.ai 25.12 同为 opkg+6.12 生态: base/packages/luci 等非内核包
# 按架构直接可装; 其 core/kmods(6.12.112) 需与固件内核补丁号一致, 若不匹配
# 请用固件自身编译的 kmod 或 ImmortalWrt 25.12.2 的 kmod(apk 目录内 ipk 需转).
# 说明: 官方 OpenWrt 与 ImmortalWrt 的 25.12 发布源均已转 apk, 无 opkg 兜底源,
# 故 25.12 线 opkg 源以 dl.openwrt.ai + luci.zwrt.de 两级覆盖.
# ============================================================

# ① 主源: dl.openwrt.ai (Kwrt) —— 覆盖绝大多数自定义包(非内核类)
src/gz kwrt_core https://dl.openwrt.ai/releases/25.12/targets/__FEED_TARGET__/6.12.112
src/gz kwrt_base https://dl.openwrt.ai/releases/25.12/packages/__FEED_ARCH__/base
src/gz kwrt_packages https://dl.openwrt.ai/releases/25.12/packages/__FEED_ARCH__/packages
src/gz kwrt_luci https://dl.openwrt.ai/releases/25.12/packages/__FEED_ARCH__/luci
src/gz kwrt_routing https://dl.openwrt.ai/releases/25.12/packages/__FEED_ARCH__/routing
src/gz kwrt_video https://dl.openwrt.ai/releases/25.12/packages/__FEED_ARCH__/video
src/gz kwrt_kiddin9 https://dl.openwrt.ai/releases/25.12/packages/__FEED_ARCH__/kiddin9

# ② 次选: luci.zwrt.de/packages —— 自有源 (zwrt主题 / 5gmodem / afrp 等), 同时支持 ipk 与 apk
src/gz zwrt https://luci.zwrt.de/packages/__FEED_ARCH__
