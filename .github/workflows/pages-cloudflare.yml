# =============================================================
# ZWRT 构建配置器网站 -> Cloudflare Pages (自动部署)
# 触发: push 到 main 且改动 site/public/** 时自动发布
# 依赖仓库配置:
#   - Secret  CLOUDFLARE_API_TOKEN (Cloudflare API Token, 含 Cloudflare Pages: Edit 权限)
#   - Variable CLOUDFLARE_ACCOUNT_ID (Cloudflare 账户 ID)
# 访问地址: https://zwrt.pages.dev
# =============================================================
name: Deploy Site to Cloudflare Pages
on:
  push:
    branches: [ main ]
    paths:
      - 'site/public/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cf-pages
  cancel-in-progress: true
jobs:
  deploy:
    name: 部署网站到 Cloudflare Pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 部署到 Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          projectName: zwrt
          directory: site/public
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          branch: main
