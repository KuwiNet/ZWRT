# =============================================================
# ZWRT 构建配置器网站 -> Cloudflare Pages (自动部署)
# 触发: push 到 main 且改动 site/** 时自动发布
# 依赖仓库配置:
#   - Secret  CLOUDFLARE_API_TOKEN (Cloudflare API Token, 含 Cloudflare Pages: Edit 权限)
#   - Secret  CLOUDFLARE_ACCOUNT_ID (Cloudflare 账户 ID)
# 访问地址: https://zwrt.de
# Pages Functions: site/public/functions/ (随 pages deploy public 自动部署)
# =============================================================
name: Deploy Site to Cloudflare Pages
on:
  push:
    branches: [ main ]
    paths:
      - 'site/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cf-pages
  cancel-in-progress: true
jobs:
  deploy:
    name: 部署网站到 Cloudflare Pages
    runs-on: ubuntu-latest
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      # secrets 不能用于 if（GitHub 限制），通过 env 中转后用 env 判断；fork 无 secrets 时绿色跳过
      - name: 未配置 Cloudflare secrets，跳过部署
        if: ${{ env.CF_TOKEN == '' || env.CF_ACCOUNT == '' }}
        run: echo "跳过：未配置 CLOUDFLARE_API_TOKEN/CLOUDFLARE_ACCOUNT_ID secrets（fork 仓库无需部署 Pages）"
      - name: 确保 Pages 项目 zwrt 存在 (不存在则创建)
        if: ${{ env.CF_TOKEN != '' && env.CF_ACCOUNT != '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ env.CF_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CF_ACCOUNT }}
        run: |
          if ! npx --yes wrangler pages project list --json 2>/dev/null | grep -q '"zwrt"'; then
            echo "Pages 项目 zwrt 不存在, 创建中..."
            npx --yes wrangler pages project create zwrt --production-branch=main
          else
            echo "Pages 项目 zwrt 已存在"
          fi
      - name: 部署到 Cloudflare Pages
        if: ${{ env.CF_TOKEN != '' && env.CF_ACCOUNT != '' }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ env.CF_TOKEN }}
          accountId: ${{ env.CF_ACCOUNT }}
          wranglerVersion: 'latest'
          workingDirectory: site
          command: pages deploy public --project-name=zwrt --branch=main
