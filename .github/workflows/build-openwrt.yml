# =============================================================
# ZWRT-openwrt 自动构建工作流 (方案 A: ImageBuilder 组装, Kwrt 引擎)
#   - 不再从源码全量编译, 改用 ImageBuilder 几分钟出固件
#   - Kwrt 引擎 (openwrt.ai), 自定义第三方源地址通过仓库 Variables 配置 (不写明文)
#   - 全量设备支持: 设备矩阵从 site/public/data/devices.json 的 build.variants 动态查找
#     (网站设备下拉全量; 手动 dispatch 可填任意设备 id, 如 xiaomi_redmi-router-ax6000)
#   - workflow_dispatch 可指定设备/参数/软件包/初始化脚本; device=all 或空 = 默认 4 台
#   - 主机名统一 ZWRT, 固件命名 zwrt-YYYYMMDD-设备
#   - 产物: Artifact + 单个 GitHub Release (ZWRT-日期) + Cloudflare R2 (只保留最近2版)
# =============================================================
name: Build OpenWrt ZWRT
run-name: Build OpenWrt ZWRT

on:
  workflow_dispatch:
    inputs:
      device:
        description: '构建目标: all/空 = 默认设备(x86_64主旁+WH3000Pro+TR3000); 或填设备 id(网站设备列表, 如 xiaomi_redmi-router-ax6000)'
        type: string
        default: all
      role:
        description: '路由角色 (旁路由生效: 关WAN/关DHCP, 需填网关/DNS)'
        type: choice
        required: true
        options:
          - main
          - bypass
        default: main
      hostname:
        description: '主机名 (默认 ZWRT)'
        type: string
        default: ''
      lan_ip:
        description: 'LAN IP (空 = 设备默认)'
        type: string
        default: ''
      lan_mask:
        description: '子网掩码 (空 = 设备默认)'
        type: string
        default: ''
      gateway:
        description: '网关 (旁路由生效; 空 = 设备默认)'
        type: string
        default: ''
      dns:
        description: 'DNS (旁路由生效; 空 = 设备默认)'
        type: string
        default: ''
      ipv6:
        description: '启用 IPv6'
        type: boolean
        default: false
      wifi:
        description: '启用无线 (WH3000 Pro 默认开)'
        type: boolean
        default: false
      wifi_ssid:
        description: '无线 SSID (空 = 设备默认)'
        type: string
        default: ''
      wifi_key:
        description: '无线密码 (空 = 无密码)'
        type: string
        default: ''
      password:
        description: '管理密码 (root 密码; 空 = 无密码)'
        type: string
        default: ''
      packages_common:
        description: '通用软件包清单 (空格分隔; 空 = 设备出厂默认; __none__ = 不装)'
        type: string
        default: ''
      packages_wh3000:
        description: 'WH3000 Pro 专属软件包清单 (空格分隔; 空 = 仓库默认; __none__ = 不装)'
        type: string
        default: ''
      init_script:
        description: '自定义系统初始化脚本 (写入 /etc/uci-defaults, 可空)'
        type: string
        default: ''
      init_script_b64:
        description: '自定义系统初始化脚本 (base64 编码, 推荐以规避多行转义问题)'
        type: string
        default: ''

concurrency:
  group: zwrt-openwrt-build
  cancel-in-progress: false

env:
  OPENWRT_REPO: ${{ vars.OPENWRT_REPO || 'immortalwrt/immortalwrt' }}
  OPENWRT_BRANCH: ${{ vars.OPENWRT_BRANCH || 'openwrt-25.12' }}

permissions:
  contents: write

jobs:
  # ---- 生成构建矩阵: all = 默认 4 台; 指定设备 = 从 devices.json 动态查找 ----
  check:
    name: 生成构建矩阵
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.mtx.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - name: 生成构建矩阵 (all=默认 / 设备id=动态查找 + 参数覆盖)
        id: mtx
        env:
          OA_BASE: ${{ vars.OPENWRT_AI_BASE }}
        run: |
          if [ -z "$OA_BASE" ]; then
            echo "::error ::未配置仓库 Variables OPENWRT_AI_BASE (Kwrt 引擎需要第三方源基础地址)"
            exit 1
          fi
          if [ -z "${{ inputs.device }}" ] || [ "${{ inputs.device }}" = "all" ]; then
            # ---- 默认设备矩阵 (与既有 4 台行为完全一致) ----
            MATRIX='[
              {"device":"x86-64-main","tag":"x86_64-main","family":"x86","feed_arch":"x86_64","feed_target":"x86/64","img_suffix":"/targets/x86/64/kwrt-imagebuilder-x86-64.Linux-x86_64.tar.zst","profile_tags":"generic,x86-64-generic,x86_64-main","lan_ip":"192.168.100.1","lan_mask":"255.255.255.0","gateway":"192.168.100.1","dns":"192.168.100.1","role":"main","ipv6":"0","wifi":"0","wifi_ssid":"","wifi_key":"","dynamic":false},
              {"device":"x86-64-bypass","tag":"x86_64-bypass","family":"x86","feed_arch":"x86_64","feed_target":"x86/64","img_suffix":"/targets/x86/64/kwrt-imagebuilder-x86-64.Linux-x86_64.tar.zst","profile_tags":"generic,x86-64-generic,x86_64-bypass","lan_ip":"192.168.100.10","lan_mask":"255.255.255.0","gateway":"192.168.100.1","dns":"192.168.100.1","role":"bypass","ipv6":"0","wifi":"0","wifi_ssid":"","wifi_key":"","dynamic":false},
              {"device":"wh3000pro","tag":"wh3000pro","family":"mtk","feed_arch":"aarch64_cortex-a53","feed_target":"mediatek/filogic","img_suffix":"/targets/mediatek/filogic/kwrt-imagebuilder-mediatek-filogic.Linux-x86_64.tar.zst","profile_tags":"huasifei_wh3000-pro-emmc,huasifei_wh3000-pro-emmc,wh3000pro-emmc;huasifei_wh3000-pro-nand,huasifei_wh3000-pro-nand,wh3000pro-nand","lan_ip":"192.168.100.1","lan_mask":"255.255.255.0","gateway":"192.168.100.1","dns":"192.168.100.1","role":"main","ipv6":"1","wifi":"1","wifi_ssid":"ZWRT","wifi_key":"","dynamic":false},
              {"device":"tr3000","tag":"tr3000","family":"mtk","feed_arch":"aarch64_cortex-a53","feed_target":"mediatek/filogic","img_suffix":"/targets/mediatek/filogic/kwrt-imagebuilder-mediatek-filogic.Linux-x86_64.tar.zst","profile_tags":"cudy_tr3000-256mb-v1,cudy_tr3000-256mb-v1,tr3000","lan_ip":"192.168.100.1","lan_mask":"255.255.255.0","gateway":"192.168.100.1","dns":"192.168.100.1","role":"main","ipv6":"1","wifi":"1","wifi_ssid":"ZWRT","wifi_key":"","dynamic":false}
            ]'
          else
            # ---- 指定设备: 从 site/public/data/devices.json 的 build.variants 动态查找 ----
            MATRIX=$(jq -c --arg id "${{ inputs.device }}" '
              [ .devices[] as $d | ($d.build.variants[]? | select(.key == $id)) as $v | $v | .device = .key ]
            ' site/public/data/devices.json)
            if [ -z "$MATRIX" ] || [ "$MATRIX" = "[]" ]; then
              echo "::error ::设备 ${{ inputs.device }} 未在 site/public/data/devices.json 的 build.variants 中找到 (设备 id 以网站设备列表为准)"
              exit 1
            fi
            echo "动态设备: ${{ inputs.device }}"
          fi
          # 计算 img_url (kwrt 用 vars.OPENWRT_AI_BASE 拼接)
          MATRIX=$(echo "$MATRIX" | jq --arg oa "$OA_BASE" \
            'map(.img_url=($oa + .img_suffix) | del(.img_suffix))')
          # 参数覆盖 (非空才覆盖; 空值保持设备默认); role 仅对动态设备(dynamic=true)生效
          MATRIX=$(echo "$MATRIX" | jq \
            --arg ip "${{ inputs.lan_ip }}" \
            --arg mask "${{ inputs.lan_mask }}" \
            --arg gw "${{ inputs.gateway }}" \
            --arg dns "${{ inputs.dns }}" \
            --arg ipv6 "${{ inputs.ipv6 }}" \
            --arg wifi "${{ inputs.wifi }}" \
            --arg ssid "${{ inputs.wifi_ssid }}" \
            --arg key "${{ inputs.wifi_key }}" \
            --arg role "${{ inputs.role }}" \
            'map(
              (.lan_ip = (if $ip != "" then $ip else .lan_ip end)) |
              (.lan_mask = (if $mask != "" then $mask else .lan_mask end)) |
              (.gateway = (if $gw != "" then $gw else .gateway end)) |
              (.dns = (if $dns != "" then $dns else .dns end)) |
              (.ipv6 = (if $ipv6 == "true" then "1" elif $ipv6 == "false" then "0" else .ipv6 end)) |
              (.wifi = (if $wifi == "true" then "1" elif $wifi == "false" then "0" else .wifi end)) |
              (.wifi_ssid = (if $ssid != "" then $ssid else .wifi_ssid end)) |
              (.wifi_key = (if $key != "" then $key else .wifi_key end)) |
              (.role = (if (.dynamic == true) and ($role != "") then $role else .role end))
            )')
          # GitHub 的 matrix 必须是对象: 用 include 包一层, fromJSON 才可展开为矩阵
          echo "matrix=$(echo "$MATRIX" | jq -c '{"include": .}')" >> "$GITHUB_OUTPUT"
          echo "$MATRIX" | jq .

  # ---- 按设备用 ImageBuilder 组装固件 ----
  build:
    name: 构建 ${{ matrix.device }}
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.check.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - name: 安装构建依赖 (zstd 解压 + qemu-img 打包 x86 镜像)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq zstd qemu-utils 2>/dev/null || true

      - name: 生成构建日期
        id: date
        run: echo "date=$(date +%Y%m%d)" >> "$GITHUB_OUTPUT"

      - name: 组装固件 (ImageBuilder 预编译包)
        id: ibuild
        env:
          DEVICE: ${{ matrix.device }}
          DATE: ${{ steps.date.outputs.date }}
          FEED_ARCH: ${{ matrix.feed_arch }}
          FEED_TARGET: ${{ matrix.feed_target }}
          IMG_URL: ${{ matrix.img_url }}
          PROFILE_TAGS: ${{ matrix.profile_tags }}
          LAN_IP: ${{ matrix.lan_ip }}
          LAN_MASK: ${{ matrix.lan_mask }}
          GATEWAY: ${{ matrix.gateway }}
          DNS: ${{ matrix.dns }}
          ROLE: ${{ matrix.role }}
          IPV6: ${{ matrix.ipv6 }}
          WIFI: ${{ matrix.wifi }}
          WIFI_SSID: ${{ matrix.wifi_ssid }}
          WIFI_KEY: ${{ matrix.wifi_key }}
          DEV_KIND: ${{ matrix.dynamic == true && 'auto' || 'legacy' }}
          ZWRT_FEED: ${{ vars.ZWRT_FEED }}
          HOSTNAME: ${{ inputs.hostname }}
          ROOT_PASS: ${{ inputs.password }}
          INIT_B64: ${{ inputs.init_script_b64 }}
          PKG_COMMON: ${{ inputs.packages_common }}
          PKG_WH3000: ${{ inputs.packages_wh3000 }}
        run: bash scripts/ibuild.sh "$GITHUB_WORKSPACE"

      - name: 收集固件到顶层
        run: |
          mkdir -p firmware/
          find *imagebuilder-*/bin/targets/${{ matrix.feed_target }}/ -type f -name 'zwrt-*' -exec cp {} firmware/ \;
          ls -lh firmware/

      - name: 上传固件 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: zwrt-${{ steps.date.outputs.date }}-${{ matrix.tag }}
          path: firmware/zwrt-*
          if-no-files-found: error

  # ---- 汇聚全部固件, 打单个 Release (ZWRT-日期-引擎), 上传 R2 (只保留最近2版) ----
  release:
    name: 发布 Release + 上传 R2
    needs: [ check, build ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 生成构建日期
        id: date
        run: |
          echo "date=$(date +%Y%m%d)" >> "$GITHUB_OUTPUT"
          echo "stamp=$(date +%Y%m%d-%H%M%S)" >> "$GITHUB_OUTPUT"

      - name: 下载全部固件 Artifact
        uses: actions/download-artifact@v4
        with:
          pattern: zwrt-${{ steps.date.outputs.date }}-*
          path: firmware/
          merge-multiple: true

      - name: 列出待发布固件
        run: ls -lh firmware/

      - name: 发布单个 Release (ZWRT-日期, 含全部固件)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="ZWRT-${{ steps.date.outputs.stamp }}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG 已存在, 覆盖上传最新固件"
            gh release upload "$TAG" firmware/zwrt-* \
              --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" firmware/zwrt-* \
              --repo "$GITHUB_REPOSITORY" \
              --title "$TAG" \
              --notes "由 ImageBuilder 组装
              构建日期: ${{ steps.date.outputs.date }}
              内容：网站提交的设备信息"
          fi

      - name: 上传全部固件到 Cloudflare R2 (firmware)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
        run: |
          if [ -z "$R2_ACCESS_KEY_ID" ] || [ -z "$R2_SECRET_ACCESS_KEY" ] || [ -z "$R2_BUCKET" ] || [ -z "$R2_PUBLIC_URL" ]; then
            echo "未配置 R2 密钥或 R2_PUBLIC_URL, 跳过上传 (请配置 R2_ACCESS_KEY_ID / R2_SECRET_ACCESS_KEY / R2_BUCKET, 并在仓库 Variables 设置 R2_PUBLIC_URL 桶公开下载前缀)"
            exit 0
          fi
          ENDPOINT="${R2_ENDPOINT:-https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com}"
          if [ -z "$R2_ACCOUNT_ID" ] && [ -z "$R2_ENDPOINT" ]; then
            echo "缺少 R2_ENDPOINT 且未配置 R2_ACCOUNT_ID, 跳过上传"
            exit 0
          fi
          echo "安装 rclone ..."
          curl -s https://rclone.org/install.sh | sudo bash >/dev/null 2>&1
          rclone config create r2 s3 \
            provider=Cloudflare \
            access_key_id="$R2_ACCESS_KEY_ID" \
            secret_access_key="$R2_SECRET_ACCESS_KEY" \
            endpoint="$ENDPOINT" \
            --non-interactive
          # ---- R2 只保留最近 2 个版本: 上传前删除更早版本 (按文件名 zwrt-YYYYMMDD-*) ----
          NEW_DATE="${{ steps.date.outputs.date }}"
          ALL_DATES=$( { rclone lsf "r2:$R2_BUCKET/firmware/" 2>/dev/null | sed -n 's/^zwrt-\([0-9]\{8\}\)-.*/\1/p'; echo "$NEW_DATE"; } | sort -u )
          KEEP_DATES=$( echo "$ALL_DATES" | sort -r | head -2 )
          echo "R2 保留最近 2 版: $(echo $KEEP_DATES | tr '\n' ' ')"
          for d in $( echo "$ALL_DATES" | sort -r | tail -n +3 ); do
            echo "删除过期版本 zwrt-${d}-*"
            rclone delete "r2:$R2_BUCKET/firmware/" --include "zwrt-${d}-*" --retries 3
          done
          # ---- 上传新固件 ----
          rclone copy firmware/ "r2:$R2_BUCKET/firmware/" --include "zwrt-*" -v
          echo "==== 上传完成, 下载地址 ===="
          for f in firmware/zwrt-*; do
            [ -f "$f" ] && echo "  ${R2_PUBLIC_URL}/firmware/$(basename "$f")"
          done
          # ---- 把 R2/B2 下载地址写进 Release body (标记 <!--R2DL--> 防重复追加) ----
          TAG="ZWRT-${{ steps.date.outputs.stamp }}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            BODY=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body)
            BODY="${BODY%%<!--R2DL-->*}"
            DL=""
            for f in firmware/zwrt-*; do
              [ -f "$f" ] && DL="${DL}${R2_PUBLIC_URL}/firmware/$(basename "$f")"$'\n'
            done
            if [ -n "$DL" ]; then
              printf '%s<!--R2DL-->\n## R2/B2 下载\n%s' "$BODY" "$DL" > /tmp/r2_body.txt
              gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file /tmp/r2_body.txt
              echo "已把 R2 下载地址写入 Release body (${R2_PUBLIC_URL}/firmware/)"
            fi
          fi
