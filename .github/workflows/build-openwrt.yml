# =============================================================
# ZWRT-openwrt 自动构建工作流
#   - 跟踪源码稳定分支 (默认 immortalwrt/immortalwrt openwrt-25.12 = 最新25.12 + opkg + 6.12内核, 支持 WH3000 Pro)
#     可用仓库变量 OPENWRT_REPO / OPENWRT_BRANCH 覆盖
#   - 稳定分支有新提交时自动编译, 无新提交则跳过 (避免空跑)
#   - 按设备矩阵构建, 每个设备一个 job
#   - 主机名统一 ZWRT, 固件命名 zwrt-YYYYMMDD-架构-设备
#   - 固件内 opkg 软件源: 全部使用 dl.openwrt.ai (Kwrt)
#   - 产物: Artifact + GitHub Release + Cloudflare R2 (dl.zwrt.de/firmware)
# =============================================================
name: Build OpenWrt ZWRT

on:
  workflow_dispatch:
    inputs:
      device:
        description: '设备/变体（x86-64-main 主路由 / x86-64-bypass 旁路由 / wh3000pro）'
        required: true
        default: x86-64-main
        type: choice
        options:
          - x86-64-main
          - x86-64-bypass
          - wh3000pro
      hostname:
        description: '主机名'
        required: false
        default: ZWRT
        type: string
      lan_ip:
        description: 'LAN IP'
        required: false
        default: 192.168.100.1
        type: string
      lan_mask:
        description: '子网掩码'
        required: false
        default: 255.255.255.0
        type: string
      gateway:
        description: '网关（旁路由必填）'
        required: false
        default: ''
        type: string
      dns:
        description: 'DNS（旁路由=网关）'
        required: false
        default: ''
        type: string
      password:
        description: '管理密码（空=无密码）'
        required: false
        default: ''
        type: string
      ipv6:
        description: '启用 IPv6'
        required: false
        default: false
        type: boolean
      wifi:
        description: '启用无线'
        required: false
        default: false
        type: boolean
      wifi_ssid:
        description: '无线 SSID'
        required: false
        default: ZWRT
        type: string
      wifi_key:
        description: '无线密码（空=无密码）'
        required: false
        default: ''
        type: string
      packages_common:
        description: '通用软件包清单（空格分隔）'
        required: false
        default: ''
        type: string
      packages_wh3000:
        description: 'WH3000 附加包清单（空格分隔）'
        required: false
        default: ''
        type: string
      init_script_b64:
        description: '初始化脚本（base64 编码）'
        required: false
        default: ''
        type: string
  schedule:
    # 每天 22:30 UTC (= 北京时间次日 06:30) 检测稳定分支更新
    - cron: '30 22 * * *'
  push:
    branches: [ main ]
    paths-ignore:
      - '.cache/**'

concurrency:
  group: zwrt-openwrt-build
  cancel-in-progress: false

env:
  OPENWRT_REPO: ${{ vars.OPENWRT_REPO || 'immortalwrt/immortalwrt' }}
  OPENWRT_BRANCH: ${{ vars.OPENWRT_BRANCH || 'openwrt-25.12' }}

permissions:
  contents: write

jobs:
  # ---- 检测稳定分支是否有新提交 ----
  check:
    name: 检测稳定分支更新
    runs-on: ubuntu-latest
    outputs:
      rev: ${{ steps.src.outputs.rev }}
      skip: ${{ steps.skip.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
      - name: 读取稳定分支最新提交
        id: src
        run: |
          REV=$(git ls-remote "https://github.com/${OPENWRT_REPO}.git" "refs/heads/${OPENWRT_BRANCH}" | awk '{print $1}')
          echo "rev=${REV}" >> "$GITHUB_OUTPUT"
          echo "最新提交: ${REV}"
      - name: 无新提交则跳过
        id: skip
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "手动触发, 强制构建"
          elif [ -f .cache/openwrt-stable-commit ] && \
               [ "$(cat .cache/openwrt-stable-commit)" = "${{ steps.src.outputs.rev }}" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "OpenWrt ${OPENWRT_BRANCH} 无新提交, 跳过"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "检测到稳定分支更新, 开始构建"
          fi

  # ---- 按设备构建 ----
  build:
    name: 构建 ${{ matrix.device }}
    needs: check
    # workflow_dispatch 时只构建所选 device；schedule/push 全量构建
    if: needs.check.outputs.skip != 'true' && (github.event_name != 'workflow_dispatch' || matrix.device == github.event.inputs.device)
    runs-on: ubuntu-latest
    timeout-minutes: 420
    strategy:
      fail-fast: false
      matrix:
        include:
          - device: x86-64-main          # 主路由
            bin_dir: bin/targets/x86/64
            arch: x86_64
            board: main
            identity: x86-64-generic
            tag: x86_64-main
            feed_arch: x86_64
            feed_target: x86/64
            lan_ip: 192.168.100.1
            lan_mask: 255.255.255.0
            gateway: 192.168.100.1
            dns: 192.168.100.1
            role: main
            ipv6: "0"
            wifi: "0"
            wifi_ssid: ""
            wifi_key: ""
          - device: x86-64-bypass       # 旁路由
            bin_dir: bin/targets/x86/64
            arch: x86_64
            board: bypass
            identity: x86-64-generic
            tag: x86_64-bypass
            feed_arch: x86_64
            feed_target: x86/64
            lan_ip: 192.168.100.10
            lan_mask: 255.255.255.0
            gateway: 192.168.100.1
            dns: 192.168.100.1
            role: bypass
            ipv6: "0"
            wifi: "0"
            wifi_ssid: ""
            wifi_key: ""
          - device: wh3000pro
            bin_dir: bin/targets/mediatek/filogic
            arch: mt7981b
            board: wh3000pro
            identity: mediatek-filogic-huasifei_wh3000-pro
            tag: wh3000pro
            feed_arch: aarch64_cortex-a53
            feed_target: mediatek/filogic
            lan_ip: 192.168.100.1
            lan_mask: 255.255.255.0
            gateway: 192.168.100.1
            dns: 192.168.100.1
            role: main
            ipv6: "1"
            wifi: "1"
            wifi_ssid: ZWRT
            wifi_key: ""
    steps:
      - uses: actions/checkout@v4

      - name: 拉取 OpenWrt 稳定分支源码
        run: |
          git clone --depth=1 --branch "${OPENWRT_BRANCH}" "https://github.com/${OPENWRT_REPO}.git" openwrt

      - name: 编译加速缓存 (ccache + dl)
        uses: actions/cache@v4
        with:
          path: |
            openwrt/dl
            ~/.ccache
          key: openwrt-${{ env.OPENWRT_BRANCH }}-${{ matrix.device }}-${{ hashFiles('configs/**','plugins/**','feeds/**') }}
          restore-keys: |
            openwrt-${{ env.OPENWRT_BRANCH }}-${{ matrix.device }}-

      - name: 合并自定义 feeds
        working-directory: openwrt
        run: bash "$GITHUB_WORKSPACE/scripts/merge-feeds.sh" "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/openwrt"

      - name: 生成 .config (目标 seed + 插件清单 + 前端包清单)
        env:
          ZWRT_EXTRA_PACKAGES: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.packages_common || '' }}
          ZWRT_EXTRA_WH3000: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.packages_wh3000 || '' }}
        working-directory: openwrt
        run: bash "$GITHUB_WORKSPACE/scripts/merge-config.sh" "$GITHUB_WORKSPACE" "${{ matrix.device }}" .config

      - name: 生成 opkg 软件源配置 (dl.openwrt.ai + opkg.zwrt.de)
        run: |
          sed -e "s|__FEED_ARCH__|${{ matrix.feed_arch }}|g" \
              -e "s|__FEED_TARGET__|${{ matrix.feed_target }}|g" \
              "$GITHUB_WORKSPACE/files/etc/opkg/distfeeds.conf" > /tmp/distfeeds.conf
          mv /tmp/distfeeds.conf "$GITHUB_WORKSPACE/files/etc/opkg/distfeeds.conf"
          echo "已生成 opkg 源配置 (${{ matrix.feed_arch }}):"
          cat "$GITHUB_WORKSPACE/files/etc/opkg/distfeeds.conf"

      - name: "应用定制 (files 覆盖层: 主机名 ZWRT 等)"
        working-directory: openwrt
        run: |
          cp -r "$GITHUB_WORKSPACE/files/"* ./
          echo "已复制 files/ 覆盖层"

      - name: 按变体生成网络/无线/IPv6/LuCI 配置 (替换占位符)
        env:
          LAN_IP: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.lan_ip || matrix.lan_ip }}
          LAN_MASK: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.lan_mask || matrix.lan_mask }}
          GATEWAY: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.gateway || matrix.gateway }}
          DNS: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.dns || matrix.dns }}
          ROLE: ${{ matrix.role }}
          IPV6: "${{ github.event_name == 'workflow_dispatch' && (github.event.inputs.ipv6 == 'true' ? '1' : '0') || matrix.ipv6 }}"
          WIFI: "${{ github.event_name == 'workflow_dispatch' && (github.event.inputs.wifi == 'true' ? '1' : '0') || matrix.wifi }}"
          WIFI_SSID: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.wifi_ssid || matrix.wifi_ssid }}
          WIFI_KEY: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.wifi_key || matrix.wifi_key }}
        working-directory: openwrt
        run: |
          sed -e "s|__LAN_IP__|${LAN_IP}|g" \
              -e "s|__LAN_MASK__|${LAN_MASK}|g" \
              -e "s|__GATEWAY__|${GATEWAY}|g" \
              -e "s|__DNS__|${DNS}|g" \
              -e "s|__ROLE__|${ROLE}|g" \
              -e "s|__IPV6__|${IPV6}|g" \
              -e "s|__WIFI__|${WIFI}|g" \
              -e "s|__WIFI_SSID__|${WIFI_SSID}|g" \
              -e "s|__WIFI_KEY__|${WIFI_KEY}|g" \
              etc/uci-defaults/99-zwrt-network > /tmp/zwrt-nw
          mv /tmp/zwrt-nw etc/uci-defaults/99-zwrt-network
          chmod +x etc/uci-defaults/99-zwrt-network
          echo "已生成变体配置 (${{ matrix.device }}):"
          cat etc/uci-defaults/99-zwrt-network

      - name: 应用主机名与管理密码
        env:
          HOSTNAME: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.hostname || 'ZWRT' }}
          ROOT_PASS: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.password || '' }}
        working-directory: openwrt
        run: |
          sed -i "s|__HOSTNAME__|${HOSTNAME}|g" etc/config/system
          echo "主机名: ${HOSTNAME}"
          if [ -n "$ROOT_PASS" ]; then
            printf '#!/bin/sh\n(echo "ZWRTROOTPASS"; echo "ZWRTROOTPASS") | passwd root 2>/dev/null || true\nexit 0\n' > etc/uci-defaults/98-zwrt-pass
            sed -i "s|ZWRTROOTPASS|${ROOT_PASS}|g" etc/uci-defaults/98-zwrt-pass
            chmod +x etc/uci-defaults/98-zwrt-pass
            echo "已写入管理密码 uci-defaults"
          else
            echo "管理密码为空, 保持无密码"
          fi

      - name: 写入前端初始化脚本 (base64)
        env:
          INIT_B64: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.init_script_b64 || '' }}
        working-directory: openwrt
        run: |
          if [ -n "$INIT_B64" ]; then
            echo "$INIT_B64" | base64 -d > etc/uci-defaults/98-zwrt-custom
            chmod +x etc/uci-defaults/98-zwrt-custom
            echo "已写入 98-zwrt-custom ($(wc -l < etc/uci-defaults/98-zwrt-custom) 行)"
            cat etc/uci-defaults/98-zwrt-custom
          else
            echo "无自定义初始化脚本"
          fi

      - name: 预下载源码包 (带重试)
        working-directory: openwrt
        run: |
          make defconfig
          for i in 1 2 3; do
            make download -j$(nproc) 2>&1 | tail -8 && break
            echo "download 第 ${i} 次失败, 重试..."
          done

      - name: 编译固件
        working-directory: openwrt
        run: |
          make -j$(nproc) V=s 2>&1 | tee build-${{ matrix.device }}.log
          echo "==== 产物目录 ===="
          ls -lh "${{ matrix.bin_dir }}" | tail -20

      - name: 生成构建日期
        id: date
        run: echo "date=$(date +%Y%m%d)" >> "$GITHUB_OUTPUT"

      - name: 重命名固件 (zwrt-日期-架构-设备)
        working-directory: openwrt
        run: |
          bash "$GITHUB_WORKSPACE/scripts/custom.sh" \
            "$GITHUB_WORKSPACE/openwrt/${{ matrix.bin_dir }}" \
            "${{ steps.date.outputs.date }}" "${{ matrix.tag }}" "${{ matrix.identity }}"

      - name: 上传固件 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: zwrt-${{ steps.date.outputs.date }}-${{ matrix.tag }}
          path: openwrt/${{ matrix.bin_dir }}/zwrt-*

  # ---- 汇聚全部固件, 打单个 Release (zwrt-日期), 上传 R2 ----
  release:
    name: 发布 Release + 上传 R2
    needs: [ check, build ]
    if: needs.check.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 生成构建日期
        id: date
        run: echo "date=$(date +%Y%m%d)" >> "$GITHUB_OUTPUT"

      - name: 下载全部固件 Artifact
        uses: actions/download-artifact@v4
        with:
          pattern: zwrt-${{ steps.date.outputs.date }}-*
          path: firmware/
          merge-multiple: true

      - name: 列出待发布固件
        run: ls -lh firmware/

      - name: 发布单个 Release (ZWRT-日期, 含全部固件)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="ZWRT-${{ steps.date.outputs.date }}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG 已存在, 跳过创建"
          else
            gh release create "$TAG" firmware/zwrt-* \
              --repo "$GITHUB_REPOSITORY" \
              --title "$TAG" \
              --notes "OpenWrt ${{ env.OPENWRT_BRANCH }} @ ${{ needs.check.outputs.rev }}
              构建日期: ${{ steps.date.outputs.date }}
              内容: x86_64 主路由 / x86_64 旁路由 / WH3000 Pro (eMMC+NAND)
              下载: https://dl.zwrt.de/firmware/"
          fi

      - name: 上传全部固件到 Cloudflare R2 (dl.zwrt.de/firmware)
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PUBLIC_URL: ${{ vars.R2_PUBLIC_URL || 'https://dl.zwrt.de' }}
        run: |
          if [ -z "$R2_ACCESS_KEY_ID" ] || [ -z "$R2_SECRET_ACCESS_KEY" ] || [ -z "$R2_BUCKET" ]; then
            echo "未配置 R2 密钥, 跳过上传 (请先在仓库 Secrets 配置 R2_ACCESS_KEY_ID / R2_SECRET_ACCESS_KEY / R2_BUCKET)"
            exit 0
          fi
          # R2_ENDPOINT 未单独配置时, 由 ACCOUNT_ID 推导 (标准 R2 S3 端点)
          ENDPOINT="${R2_ENDPOINT:-https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com}"
          if [ -z "$R2_ACCOUNT_ID" ] && [ -z "$R2_ENDPOINT" ]; then
            echo "缺少 R2_ENDPOINT 且未配置 R2_ACCOUNT_ID, 跳过上传"
            exit 0
          fi
          echo "安装 rclone ..."
          curl -s https://rclone.org/install.sh | sudo bash >/dev/null 2>&1
          rclone config create r2 s3 \
            provider=Cloudflare \
            access_key_id="$R2_ACCESS_KEY_ID" \
            secret_access_key="$R2_SECRET_ACCESS_KEY" \
            endpoint="$ENDPOINT" \
            --non-interactive
          # ---- R2 只保留最近 2 个版本: 上传前删除更早版本 (按文件名 zwrt-YYYYMMDD-*) ----
          NEW_DATE="${{ steps.date.outputs.date }}"
          ALL_DATES=$( { rclone lsf "r2:$R2_BUCKET/firmware/" 2>/dev/null | sed -n 's/^zwrt-\([0-9]\{8\}\)-.*/\1/p'; echo "$NEW_DATE"; } | sort -u )
          KEEP_DATES=$( echo "$ALL_DATES" | sort -r | head -2 )
          echo "R2 保留最近 2 版: $(echo $KEEP_DATES | tr '\n' ' ')"
          for d in $( echo "$ALL_DATES" | sort -r | tail -n +3 ); do
            echo "删除过期版本 zwrt-${d}-*"
            rclone delete "r2:$R2_BUCKET/firmware/" --include "zwrt-${d}-*" --retries 3
          done
          # ---- 上传新固件 ----
          rclone copy firmware/ "r2:$R2_BUCKET/firmware/" --include "zwrt-*" -v
          echo "==== 上传完成, 下载地址 ===="
          for f in firmware/zwrt-*; do
            [ -f "$f" ] && echo "  ${R2_PUBLIC_URL}/firmware/$(basename "$f")"
          done

  # ---- 构建成功后记录本次源码提交 (单一 job, 避免并发写冲突) ----
  record:
    name: 记录构建版本
    needs: [ check, build ]
    if: needs.check.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 写缓存并提交
        run: |
          mkdir -p .cache
          echo "${{ needs.check.outputs.rev }}" > .cache/openwrt-stable-commit
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .cache/openwrt-stable-commit
          git commit -m "chore: 记录已构建 OpenWrt ${OPENWRT_BRANCH} ${REV}" || echo "无变更"
          git push