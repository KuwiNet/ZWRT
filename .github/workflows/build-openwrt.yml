# =============================================================
# ZWRT-openwrt 自动构建工作流
#   - 跟踪源码稳定分支 (默认 immortalwrt/immortalwrt openwrt-25.12 = 最新25.12 + opkg + 6.12内核, 支持 WH3000 Pro)
#     可用仓库变量 OPENWRT_REPO / OPENWRT_BRANCH 覆盖
#   - 稳定分支有新提交时自动编译, 无新提交则跳过 (避免空跑)
#   - 按设备矩阵构建, 每个设备一个 job; workflow_dispatch 可指定设备/参数/软件包/初始化脚本
#   - 主机名统一 ZWRT, 固件命名 zwrt-YYYYMMDD-架构-设备
#   - 固件内 opkg 软件源: 全部使用 dl.openwrt.ai (Kwrt) + luci.zwrt.de
#   - 产物: Artifact + 单个 GitHub Release (ZWRT-日期) + Cloudflare R2 (dl.zwrt.de/firmware, 只保留最近2版)
# =============================================================
name: Build OpenWrt ZWRT

on:
  workflow_dispatch:
    inputs:
      device:
        description: '构建目标 (all = 全部设备)'
        type: choice
        required: true
        options:
          - all
          - x86-64-main
          - x86-64-bypass
          - wh3000pro
        default: all
      hostname:
        description: '主机名 (默认 ZWRT)'
        type: string
        default: ''
      lan_ip:
        description: 'LAN IP (空 = 设备默认)'
        type: string
        default: ''
      lan_mask:
        description: '子网掩码 (空 = 设备默认)'
        type: string
        default: ''
      gateway:
        description: '网关 (旁路由生效; 空 = 设备默认)'
        type: string
        default: ''
      dns:
        description: 'DNS (旁路由生效; 空 = 设备默认)'
        type: string
        default: ''
      ipv6:
        description: '启用 IPv6'
        type: boolean
        default: false
      wifi:
        description: '启用无线 (WH3000 Pro 默认开)'
        type: boolean
        default: false
      wifi_ssid:
        description: '无线 SSID (空 = 设备默认)'
        type: string
        default: ''
      wifi_key:
        description: '无线密码 (空 = 无密码)'
        type: string
        default: ''
      password:
        description: '管理密码 (root 密码; 空 = 无密码)'
        type: string
        default: ''
      packages_common:
        description: '通用软件包清单 (空格分隔; 空 = 仓库默认全部; __none__ = 不装)'
        type: string
        default: ''
      packages_wh3000:
        description: 'WH3000 Pro 专属软件包清单 (空格分隔; 空 = 仓库默认; __none__ = 不装)'
        type: string
        default: ''
      init_script:
        description: '自定义系统初始化脚本 (写入 /etc/uci-defaults, 可空)'
        type: string
        default: ''
      init_script_b64:
        description: '自定义系统初始化脚本 (base64 编码, 推荐以规避多行转义问题)'
        type: string
        default: ''

concurrency:
  group: zwrt-openwrt-build
  cancel-in-progress: false

env:
  OPENWRT_REPO: ${{ vars.OPENWRT_REPO || 'immortalwrt/immortalwrt' }}
  OPENWRT_BRANCH: ${{ vars.OPENWRT_BRANCH || 'openwrt-25.12' }}

permissions:
  contents: write

jobs:
  # ---- 检测稳定分支是否有新提交 + 生成构建矩阵 (支持 dispatch 筛选/覆盖) ----
  check:
    name: 检测稳定分支更新
    runs-on: ubuntu-latest
    outputs:
      rev: ${{ steps.src.outputs.rev }}
      skip: ${{ steps.skip.outputs.skip }}
      matrix: ${{ steps.mtx.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - name: 读取稳定分支最新提交
        id: src
        run: |
          REV=$(git ls-remote "https://github.com/${OPENWRT_REPO}.git" "refs/heads/${OPENWRT_BRANCH}" | awk '{print $1}')
          echo "rev=${REV}" >> "$GITHUB_OUTPUT"
          echo "最新提交: ${REV}"
      - name: 无新提交则跳过
        id: skip
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "手动触发, 强制构建"
          elif [ -f .cache/openwrt-stable-commit ] && \
               [ "$(cat .cache/openwrt-stable-commit)" = "${{ steps.src.outputs.rev }}" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "OpenWrt ${OPENWRT_BRANCH} 无新提交, 跳过"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "检测到稳定分支更新, 开始构建"
          fi
      - name: 生成构建矩阵 (dispatch 设备筛选 + 参数覆盖)
        id: mtx
        run: |
          MATRIX='[
            {"device":"x86-64-main","bin_dir":"bin/targets/x86/64","arch":"x86_64","board":"main","identity":"x86-64-generic","tag":"x86_64-main","feed_arch":"x86_64","feed_target":"x86/64","family":"x86","lan_ip":"192.168.100.1","lan_mask":"255.255.255.0","gateway":"192.168.100.1","dns":"192.168.100.1","role":"main","ipv6":"0","wifi":"0","wifi_ssid":"","wifi_key":""},
            {"device":"x86-64-bypass","bin_dir":"bin/targets/x86/64","arch":"x86_64","board":"bypass","identity":"x86-64-generic","tag":"x86_64-bypass","feed_arch":"x86_64","feed_target":"x86/64","family":"x86","lan_ip":"192.168.100.10","lan_mask":"255.255.255.0","gateway":"192.168.100.1","dns":"192.168.100.1","role":"bypass","ipv6":"0","wifi":"0","wifi_ssid":"","wifi_key":""},
            {"device":"wh3000pro","bin_dir":"bin/targets/mediatek/filogic","arch":"mt7981b","board":"wh3000pro","identity":"mediatek-filogic-huasifei_wh3000-pro","tag":"wh3000pro","feed_arch":"aarch64_cortex-a53","feed_target":"mediatek/filogic","family":"mtk","lan_ip":"192.168.100.1","lan_mask":"255.255.255.0","gateway":"192.168.100.1","dns":"192.168.100.1","role":"main","ipv6":"1","wifi":"1","wifi_ssid":"ZWRT","wifi_key":""}
          ]'
          # 设备筛选 (仅 dispatch 且指定单设备)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.device }}" ] && [ "${{ inputs.device }}" != "all" ]; then
            MATRIX=$(echo "$MATRIX" | jq --arg d "${{ inputs.device }}" '[.[] | select(.device==$d)]')
          fi
          # 参数覆盖 (非空才覆盖; 空值保持设备默认)
          MATRIX=$(echo "$MATRIX" | jq \
            --arg ip "${{ inputs.lan_ip }}" \
            --arg mask "${{ inputs.lan_mask }}" \
            --arg gw "${{ inputs.gateway }}" \
            --arg dns "${{ inputs.dns }}" \
            --arg ipv6 "${{ inputs.ipv6 }}" \
            --arg wifi "${{ inputs.wifi }}" \
            --arg ssid "${{ inputs.wifi_ssid }}" \
            --arg key "${{ inputs.wifi_key }}" \
            'map(
              (.lan_ip = (if $ip != "" then $ip else .lan_ip end)) |
              (.lan_mask = (if $mask != "" then $mask else .lan_mask end)) |
              (.gateway = (if $gw != "" then $gw else .gateway end)) |
              (.dns = (if $dns != "" then $dns else .dns end)) |
              (.ipv6 = (if $ipv6 == "true" then "1" elif $ipv6 == "false" then "0" else .ipv6 end)) |
              (.wifi = (if $wifi == "true" then "1" elif $wifi == "false" then "0" else .wifi end)) |
              (.wifi_ssid = (if $ssid != "" then $ssid else .wifi_ssid end)) |
              (.wifi_key = (if $key != "" then $key else .wifi_key end))
            )')
          # GitHub 的 matrix 必须是对象: 用 include 包一层, fromJSON 才可展开为矩阵
          echo "matrix=$(echo "$MATRIX" | jq -c '{"include": .}')" >> "$GITHUB_OUTPUT"
          echo "==== 构建矩阵 ===="
          echo "$MATRIX" | jq .

  # ---- 按设备构建 ----
  build:
    name: 构建 ${{ matrix.device }}
    needs: check
    if: needs.check.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 420
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.check.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - name: 拉取 OpenWrt 稳定分支源码
        run: |
          git clone --depth=1 --branch "${OPENWRT_BRANCH}" "https://github.com/${OPENWRT_REPO}.git" openwrt

      - name: 编译加速缓存 (ccache + dl)
        uses: actions/cache@v4
        with:
          path: |
            openwrt/dl
            ~/.ccache
          key: openwrt-${{ env.OPENWRT_BRANCH }}-${{ matrix.device }}-${{ hashFiles('configs/**','plugins/**','feeds/**') }}
          restore-keys: |
            openwrt-${{ env.OPENWRT_BRANCH }}-${{ matrix.device }}-

      - name: 合并自定义 feeds
        working-directory: openwrt
        run: bash "$GITHUB_WORKSPACE/scripts/merge-feeds.sh" "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/openwrt"

      - name: 生成 .config (目标 seed + 插件清单)
        working-directory: openwrt
        run: bash "$GITHUB_WORKSPACE/scripts/merge-config.sh" "$GITHUB_WORKSPACE" "${{ matrix.device }}" .config

      - name: 应用自定义软件包清单 (workflow_dispatch)
        if: ${{ github.event_name == 'workflow_dispatch' }}
        working-directory: openwrt
        env:
          PKG_COMMON: ${{ inputs.packages_common }}
          PKG_WH3000: ${{ inputs.packages_wh3000 }}
        run: |
          # 按来源精确增删: 空 = 仓库默认; __none__ = 全不装; 其它 = 以该清单为准
          apply_list() {
            local src="$1" list="$2"
            [ -z "$list" ] && return 0
            [ -f .config.plugins ] || return 0
            while read -r s p; do
              [ "$s" = "$src" ] || continue
              if [ "$list" = "__none__" ]; then
                sed -i "/^CONFIG_PACKAGE_${p}=y/d" .config
              else
                case " $list " in *" $p "*) : ;; *) sed -i "/^CONFIG_PACKAGE_${p}=y/d" .config ;; esac
              fi
            done < .config.plugins
            if [ "$list" != "__none__" ]; then
              for p in $list; do
                grep -q "^CONFIG_PACKAGE_${p}=y" .config || echo "CONFIG_PACKAGE_${p}=y" >> .config
              done
            fi
          }
          apply_list common "$PKG_COMMON"
          apply_list wh3000pro "$PKG_WH3000"
          echo "== 应用后 .config 软件包行数: $(grep -c '^CONFIG_PACKAGE_.*=y' .config)"

      - name: 生成 opkg 软件源配置 (dl.openwrt.ai + luci.zwrt.de)
        run: |
          sed -e "s|__FEED_ARCH__|${{ matrix.feed_arch }}|g" \
              -e "s|__FEED_TARGET__|${{ matrix.feed_target }}|g" \
              "$GITHUB_WORKSPACE/files/etc/opkg/distfeeds.conf" > /tmp/distfeeds.conf
          mv /tmp/distfeeds.conf "$GITHUB_WORKSPACE/files/etc/opkg/distfeeds.conf"
          echo "已生成 opkg 源配置 (${{ matrix.feed_arch }}):"
          cat "$GITHUB_WORKSPACE/files/etc/opkg/distfeeds.conf"

      - name: "应用定制 (files 覆盖层: 主机名 ZWRT 等)"
        working-directory: openwrt
        run: |
          cp -r "$GITHUB_WORKSPACE/files/"* ./
          echo "已复制 files/ 覆盖层"

      - name: 应用自定义主机名 (workflow_dispatch, 空=默认 ZWRT)
        working-directory: openwrt
        env:
          HN: ${{ inputs.hostname }}
        run: |
          if [ -z "$HN" ] || [ "$HN" = "ZWRT" ]; then
            echo "主机名未设置或为 ZWRT, 保持默认 (etc/config/system 已含 ZWRT)"
          else
            sed -i "s/option hostname '.*'/option hostname '$HN'/" etc/config/system
            echo "主机名已改为: $HN"
          fi

      - name: 应用管理密码 (workflow_dispatch, 空=无密码)
        working-directory: openwrt
        env:
          ROOT_PASS: ${{ inputs.password }}
        run: |
          if [ -z "$ROOT_PASS" ]; then
            echo "管理密码未设置, 保持默认 (无密码, 首次开机请设置密码)"
            exit 0
          fi
          printf '#!/bin/sh\n(echo "%s"; echo "%s") | passwd root 2>/dev/null || true\nexit 0\n' "$ROOT_PASS" "$ROOT_PASS" > etc/uci-defaults/89-zwrt-pass
          chmod +x etc/uci-defaults/89-zwrt-pass
          echo "已写入管理密码 uci-defaults (89-zwrt-pass)"

      - name: 按变体生成网络/无线/IPv6/LuCI 配置 (替换占位符)
        working-directory: openwrt
        run: |
          sed -e "s|__LAN_IP__|${{ matrix.lan_ip }}|g" \
              -e "s|__LAN_MASK__|${{ matrix.lan_mask }}|g" \
              -e "s|__GATEWAY__|${{ matrix.gateway }}|g" \
              -e "s|__DNS__|${{ matrix.dns }}|g" \
              -e "s|__ROLE__|${{ matrix.role }}|g" \
              -e "s|__IPV6__|${{ matrix.ipv6 }}|g" \
              -e "s|__WIFI__|${{ matrix.wifi }}|g" \
              -e "s|__WIFI_SSID__|${{ matrix.wifi_ssid }}|g" \
              -e "s|__WIFI_KEY__|${{ matrix.wifi_key }}|g" \
              etc/uci-defaults/99-zwrt-network > /tmp/zwrt-nw
          mv /tmp/zwrt-nw etc/uci-defaults/99-zwrt-network
          chmod +x etc/uci-defaults/99-zwrt-network
          echo "已生成变体配置 (${{ matrix.device }}):"
          cat etc/uci-defaults/99-zwrt-network

      - name: 配置 DNS 主机记录 (zwrt → LAN IP, 改 LAN IP 自动跟随)
        working-directory: openwrt
        run: |
          mkdir -p etc/hotplug.d/iface
          cat > etc/hotplug.d/iface/20-zwrt-dns <<'EOF'
#!/bin/sh
[ "$ACTION" = "ifup" ] || exit 0
[ "$INTERFACE" = "lan" ] || exit 0
IP=$(uci get network.lan.ipaddr 2>/dev/null)
[ -n "$IP" ] || exit 0
uci set dhcp.@dnsmasq[0].address="/zwrt/$IP"
uci commit dhcp
/etc/init.d/dnsmasq restart
exit 0
EOF
          chmod +x etc/hotplug.d/iface/20-zwrt-dns
          echo "已配置 DNS 主机记录 hotplug (20-zwrt-dns): 浏览器访问 http://zwrt 打开后台"

      - name: 写入自定义初始化脚本 (workflow_dispatch, base64)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.init_script_b64 != '' }}
        working-directory: openwrt
        env:
          INIT_B64: ${{ inputs.init_script_b64 }}
        run: |
          if [ -n "$INIT_B64" ]; then
            echo "$INIT_B64" | base64 -d > etc/uci-defaults/90-zwrt-custom-init
            chmod +x etc/uci-defaults/90-zwrt-custom-init
            echo "已写入 etc/uci-defaults/90-zwrt-custom-init ($(wc -l < etc/uci-defaults/90-zwrt-custom-init) 行)"
            cat etc/uci-defaults/90-zwrt-custom-init
          fi

      - name: 预下载源码包 (带重试)
        working-directory: openwrt
        run: |
          make defconfig
          for i in 1 2 3; do
            make download -j$(nproc) 2>&1 | tail -8 && break
            echo "download 第 ${i} 次失败, 重试..."
          done

      - name: 编译固件
        working-directory: openwrt
        run: |
          make -j$(nproc) V=s 2>&1 | tee build-${{ matrix.device }}.log
          echo "==== 产物目录 ===="
          ls -lh "${{ matrix.bin_dir }}" | tail -20

      - name: 生成构建日期
        id: date
        run: echo "date=$(date +%Y%m%d)" >> "$GITHUB_OUTPUT"

      - name: 重命名固件 (zwrt-日期-架构-设备)
        working-directory: openwrt
        run: |
          bash "$GITHUB_WORKSPACE/scripts/custom.sh" \
            "$GITHUB_WORKSPACE/openwrt/${{ matrix.bin_dir }}" \
            "${{ steps.date.outputs.date }}" "${{ matrix.tag }}" "${{ matrix.identity }}"

      - name: 上传固件 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: zwrt-${{ steps.date.outputs.date }}-${{ matrix.tag }}
          path: openwrt/${{ matrix.bin_dir }}/zwrt-*

  # ---- 汇聚全部固件, 打单个 Release (ZWRT-日期), 上传 R2 (只保留最近2版) ----
  release:
    name: 发布 Release + 上传 R2
    needs: [ check, build ]
    if: needs.check.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 生成构建日期
        id: date
        run: echo "date=$(date +%Y%m%d)" >> "$GITHUB_OUTPUT"

      - name: 下载全部固件 Artifact
        uses: actions/download-artifact@v4
        with:
          pattern: zwrt-${{ steps.date.outputs.date }}-*
          path: firmware/
          merge-multiple: true

      - name: 列出待发布固件
        run: ls -lh firmware/

      - name: 发布单个 Release (ZWRT-日期, 含全部固件)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="ZWRT-${{ steps.date.outputs.date }}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG 已存在, 跳过创建"
          else
            gh release create "$TAG" firmware/zwrt-* \
              --repo "$GITHUB_REPOSITORY" \
              --title "$TAG" \
              --notes "OpenWrt ${{ env.OPENWRT_BRANCH }} @ ${{ needs.check.outputs.rev }}
              构建日期: ${{ steps.date.outputs.date }}
              内容: x86_64 主路由 / x86_64 旁路由 / WH3000 Pro (eMMC+NAND)"
          fi

      - name: 上传全部固件到 Cloudflare R2 (dl.zwrt.de/firmware)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PUBLIC_URL: ${{ vars.R2_PUBLIC_URL }}
        run: |
          if [ -z "$R2_ACCESS_KEY_ID" ] || [ -z "$R2_SECRET_ACCESS_KEY" ] || [ -z "$R2_BUCKET" ] || [ -z "$R2_PUBLIC_URL" ]; then
            echo "未配置 R2 密钥或 R2_PUBLIC_URL, 跳过上传 (请配置 R2_ACCESS_KEY_ID / R2_SECRET_ACCESS_KEY / R2_BUCKET, 并在仓库 Variables 设置 R2_PUBLIC_URL 桶公开下载前缀)"
            exit 0
          fi
          # R2_ENDPOINT 未单独配置时, 由 ACCOUNT_ID 推导 (标准 R2 S3 端点)
          ENDPOINT="${R2_ENDPOINT:-https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com}"
          if [ -z "$R2_ACCOUNT_ID" ] && [ -z "$R2_ENDPOINT" ]; then
            echo "缺少 R2_ENDPOINT 且未配置 R2_ACCOUNT_ID, 跳过上传"
            exit 0
          fi
          echo "安装 rclone ..."
          curl -s https://rclone.org/install.sh | sudo bash >/dev/null 2>&1
          rclone config create r2 s3 \
            provider=Cloudflare \
            access_key_id="$R2_ACCESS_KEY_ID" \
            secret_access_key="$R2_SECRET_ACCESS_KEY" \
            endpoint="$ENDPOINT" \
            --non-interactive
          # ---- R2 只保留最近 2 个版本: 上传前删除更早版本 (按文件名 zwrt-YYYYMMDD-*) ----
          NEW_DATE="${{ steps.date.outputs.date }}"
          ALL_DATES=$( { rclone lsf "r2:$R2_BUCKET/firmware/" 2>/dev/null | sed -n 's/^zwrt-\([0-9]\{8\}\)-.*/\1/p'; echo "$NEW_DATE"; } | sort -u )
          KEEP_DATES=$( echo "$ALL_DATES" | sort -r | head -2 )
          echo "R2 保留最近 2 版: $(echo $KEEP_DATES | tr '\n' ' ')"
          for d in $( echo "$ALL_DATES" | sort -r | tail -n +3 ); do
            echo "删除过期版本 zwrt-${d}-*"
            rclone delete "r2:$R2_BUCKET/firmware/" --include "zwrt-${d}-*" --retries 3
          done
          # ---- 上传新固件 ----
          rclone copy firmware/ "r2:$R2_BUCKET/firmware/" --include "zwrt-*" -v
          echo "==== 上传完成, 下载地址 ===="
          for f in firmware/zwrt-*; do
            [ -f "$f" ] && echo "  ${R2_PUBLIC_URL}/firmware/$(basename "$f")"
          done
          # ---- 把 R2/B2 下载地址写进 Release body (标记 <!--R2DL--> 防重复追加) ----
          TAG="ZWRT-${{ steps.date.outputs.date }}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            BODY=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body)
            BODY="${BODY%%<!--R2DL-->*}"
            DL=""
            for f in firmware/zwrt-*; do
              [ -f "$f" ] && DL="${DL}${R2_PUBLIC_URL}/firmware/$(basename "$f")"$'\n'
            done
            if [ -n "$DL" ]; then
              printf '%s<!--R2DL-->\n## R2/B2 下载\n%s' "$BODY" "$DL" > /tmp/r2_body.txt
              gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file /tmp/r2_body.txt
              echo "已把 R2 下载地址写入 Release body (${R2_PUBLIC_URL}/firmware/)"
            fi
          fi

  # ---- 构建成功后记录本次源码提交 (单一 job, 避免并发写冲突) ----
  record:
    name: 记录构建版本
    needs: [ check, build ]
    if: needs.check.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 写缓存并提交
        run: |
          mkdir -p .cache
          echo "${{ needs.check.outputs.rev }}" > .cache/openwrt-stable-commit
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .cache/openwrt-stable-commit
          git commit -m "chore: 记录已构建 OpenWrt ${OPENWRT_BRANCH} ${REV}" || echo "无变更"
          git push
