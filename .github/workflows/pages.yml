# =============================================================
# ZWRT 构建配置器网站 -> GitHub Pages
# 触发: push 到 main 且改动 site/** 时自动发布
# 注意: 首次需在 仓库 Settings -> Pages -> Source 选择 "GitHub Actions"
# 访问地址: https://<用户名>.github.io/ZWRT/
# =============================================================
name: Deploy Site to GitHub Pages

on:
  push:
    branches: [ main ]
    paths:
      - 'site/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: 发布网站到 GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 配置 GitHub Pages
        uses: actions/configure-pages@v5

      - name: 上传 site/ 产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: 部署
        id: deployment
        uses: actions/deploy-pages@v4
