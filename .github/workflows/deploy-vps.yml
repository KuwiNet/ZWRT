name: Deploy ZWRT site to VPS

on:
  push:
    branches: [main]
    paths:
      - 'site/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_KEY: ${{ secrets.VPS_KEY }}
    steps:
      # secrets 不能用于 if（GitHub 限制），通过 env 中转后用 env 判断；fork 无 secrets 时绿色跳过
      - name: 未配置 VPS secrets，跳过部署
        if: ${{ env.VPS_HOST == '' || env.VPS_KEY == '' }}
        run: echo "跳过：未配置 VPS_HOST/VPS_KEY secrets（fork 仓库无需部署 VPS）"
      - name: SSH to VPS and update
        if: ${{ env.VPS_HOST != '' && env.VPS_KEY != '' }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=15 \
              -i ~/.ssh/id_ed25519 -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" \
              "cd /opt/zwrt && git pull && docker restart ZWRT && echo DEPLOY_OK"
