name: Deploy ZWRT site to VPS

on:
  push:
    branches: [main]
    paths:
      - 'site/**'

jobs:
  deploy:
    # 未配置 VPS secrets 时跳过（如 fork 仓库），避免报错；主仓库配置后正常部署
    if: ${{ secrets.VPS_HOST != '' && secrets.VPS_KEY != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: SSH to VPS and update
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_KEY: ${{ secrets.VPS_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=15 \
              -i ~/.ssh/id_ed25519 -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" \
              "cd /opt/zwrt && git pull && docker restart ZWRT && echo DEPLOY_OK"
